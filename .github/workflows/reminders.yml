# Free daily job: wakes the app (free hosts sleep), sends reminder emails and cleans up old data.
# Needs two repository secrets: APP_URL (e.g. https://subtrack.onrender.com) and CRON_SECRET (same value as on the server).
name: Daily reminders
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL or CRON_SECRET not set, skipping"; exit 0; fi
          curl -fsS --retry 4 --retry-all-errors --retry-delay 20 --max-time 120 \
            -X POST "$APP_URL/api/cron/reminders" \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" -d '{}'
